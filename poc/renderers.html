<!DOCTYPE html>

<!-- MusicXML renderer comparison (OSMD vs Verovio) for the PoC. Throwaway code: see README.md. -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Renderer comparison</title>
<style>
  :root { color-scheme: light dark; --accent: #2a6ad1; --err: #d22; }
  * { box-sizing: border-box; }
  body { margin: 0 auto; padding: 12px; max-width: 900px; font: 16px/1.4 system-ui, sans-serif; }
  h1 { font-size: 1.2rem; margin: 0 0 8px; }
  h2 { font-size: 1rem; margin: 16px 0 6px; }
  button, a.btn { display: inline-flex; align-items: center; min-height: 48px; min-width: 48px; padding: 0 12px;
                  font-size: 16px; border: 1px solid #8888; border-radius: 4px; color: inherit; text-decoration: none; }
  a.btn[aria-current="true"] { background: var(--accent); color: #fff; border-color: var(--accent); }
  .row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin: 8px 0; }
  .paper { background: #fff; color: #000; border-radius: 8px; }
  #page { overflow: hidden; }
  #ribbonWrap { position: relative; overflow-x: auto; overflow-y: hidden; scroll-behavior: smooth; }
  #ribbon { position: relative; display: inline-block; }
  #ribbon svg, #page svg { display: block; }
  #hl { position: absolute; top: 0; bottom: 0; background: #2a6ad133; border: 2px solid var(--accent);
        border-radius: 4px; pointer-events: none; display: none; }
  #measureLabel { font-variant-numeric: tabular-nums; min-width: 6em; }
  #log { list-style: none; margin: 0; padding: 0; font: 12px/1.35 ui-monospace, Consolas, monospace; overflow-wrap: anywhere; }
  #log li { padding: 2px 0; border-bottom: 1px solid #8884; }
  #log .err { color: var(--err); }
</style>
</head>
<body>
<h1>Renderer comparison</h1>
<div class="row">
  <a class="btn" id="pickOsmd" href="?r=osmd">OSMD</a>
  <a class="btn" id="pickVerovio" href="?r=verovio">Verovio</a>
</div>
<ol id="log"></ol>

<h2>Ribbon (one line, whole song)</h2>
<div class="row">
  <button id="prevM" type="button">◀</button>
  <span id="measureLabel">m. –</span>
  <button id="nextM" type="button">▶</button>
  <button id="playM" type="button">Step every 1 s</button>
</div>
<div id="ribbonWrap" class="paper"><div id="ribbon"></div><div id="hl"></div></div>

<h2>Page (wrapped to screen width)</h2>
<div id="page" class="paper"></div>

<script>
(function () {
  'use strict';

  var params = new URLSearchParams(location.search);
  var which = params.get('r');
  var src = params.get('src') || 'score/song.musicxml';
  var TARGET_STAFF_PX = Number(params.get('staff')) || 44;   // staff height (top line to bottom line) both renderers are scaled to
  var tight = params.get('tight') === '1';   // OSMD only: compact preset plus tighter note/lyric spacing
  var results = window.__results = { renderer: which, src: src, tight: tight, timings: {}, notes: [] };
  var boxes = [], cur = 0, timer = null;

  function $(id) { return document.getElementById(id); }
  function now() { return performance.now(); }
  function log(msg, cls) {
    var li = document.createElement('li');
    li.textContent = msg;
    if (cls) li.className = cls;
    $('log').appendChild(li);
  }
  function time(key, t0) {
    var ms = Math.round(now() - t0);
    results.timings[key] = ms;
    log(key + ': ' + ms + ' ms');
    return ms;
  }
  function fail(e) {
    results.error = String(e && e.message || e);
    log('ERROR: ' + results.error, 'err');
  }
  window.addEventListener('error', function (e) { fail(e.message + ' (' + e.filename + ':' + e.lineno + ')'); });

  $('pickOsmd').setAttribute('aria-current', String(which === 'osmd'));
  $('pickVerovio').setAttribute('aria-current', String(which === 'verovio'));
  if (which !== 'osmd' && which !== 'verovio') { log('Pick a renderer above.'); return; }

  function loadScript(url) {
    return new Promise(function (resolve, reject) {
      var s = document.createElement('script');
      s.src = url;
      s.onload = resolve;
      s.onerror = function () { reject(new Error('could not load ' + url + ' (run fetch-renderers.ps1)')); };
      document.head.appendChild(s);
    });
  }

  // Height of the first staff (top line to bottom line) in CSS px, from the rendered SVG.
  function staffHeight(root) {
    var lines = [];
    Array.prototype.forEach.call(root.querySelectorAll('path, line, rect'), function (el) {
      var r = el.getBoundingClientRect();
      if (r.width > 60 && r.height < 3) lines.push(r);   // long, thin = staff line
    });
    if (lines.length < 5) return null;
    lines.sort(function (a, b) { return a.top - b.top; });
    // first five distinct lines
    var ys = [];
    lines.forEach(function (r) {
      var y = Math.round(r.top + r.height / 2);
      if (!ys.length || y - ys[ys.length - 1] > 2) ys.push(y);
    });
    return ys.length >= 5 ? ys[4] - ys[0] : null;
  }

  function measuresVisible(width) {
    if (!boxes.length) return 0;
    var start = boxes[Math.min(5, boxes.length - 1)].x;   // skip the opening measures (clef, key, time)
    return boxes.filter(function (b) { return b.x >= start && b.x + b.w <= start + width; }).length;
  }

  function showMeasure(i) {
    if (!boxes.length) return;
    cur = Math.max(0, Math.min(boxes.length - 1, i));
    var b = boxes[cur], hl = $('hl'), wrap = $('ribbonWrap');
    hl.style.display = 'block';
    hl.style.left = b.x + 'px';
    hl.style.width = b.w + 'px';
    $('measureLabel').textContent = 'm. ' + b.n + (b.span > 1 ? '–' + (b.n + b.span - 1) : '') +
      ' (' + (cur + 1) + '/' + boxes.length + ')';
    wrap.scrollLeft = b.x + b.w / 2 - wrap.clientWidth / 2;   // keep the current measure centered
  }

  function finish() {
    var w = $('ribbonWrap').clientWidth;
    results.measureBoxes = boxes.length;
    results.firstBoxes = boxes.slice(0, 6);
    results.measuresVisibleInWidth = measuresVisible(w);
    results.ribbonStaffPx = staffHeight($('ribbon'));
    results.pageStaffPx = staffHeight($('page'));
    results.ribbonWidthPx = $('ribbon').scrollWidth;
    results.pageHeightPx = $('page').scrollHeight;
    if (performance.memory) results.jsHeapMB = +(performance.memory.usedJSHeapSize / 1e6).toFixed(1);
    log('measure boxes: ' + boxes.length + '; numbers ' + boxes.slice(0, 8).map(function (b) {
      return b.n + (b.span > 1 ? '–' + (b.n + b.span - 1) : '');
    }).join(', ') + ' …');
    log('measures visible in ' + w + ' px: ' + results.measuresVisibleInWidth +
      '; staff height ribbon ' + results.ribbonStaffPx + ' px, page ' + results.pageStaffPx + ' px');
    log('ribbon ' + results.ribbonWidthPx + ' px wide; page ' + results.pageHeightPx + ' px tall' +
      (results.jsHeapMB ? '; JS heap ' + results.jsHeapMB + ' MB' : ''));
    results.done = true;
    showMeasure(5);
  }

  // ---- OSMD ----
  function runOsmd(xml) {
    var t0 = now();
    return loadScript('vendor/opensheetmusicdisplay.min.js').then(function () {
      time('library load', t0);
      var opts = {
        backend: 'svg', autoResize: false, drawTitle: false, drawSubtitle: false, drawComposer: false,
        drawLyricist: false, drawCredits: false, drawPartNames: false, drawPartAbbreviations: false,
        drawMeasureNumbers: true
      };
      if (tight) opts.drawingParameters = 'compacttight';
      function tighten(o) {
        if (!tight) return;
        var r = o.EngravingRules;
        r.VoiceSpacingMultiplierVexflow = 0.55;
        r.VoiceSpacingAddendVexflow = 2.0;
        r.LyricsXPaddingFactorForLongLyrics = 0.5;
      }
      var ribbon = new opensheetmusicdisplay.OpenSheetMusicDisplay($('ribbon'),
        Object.assign({}, opts, { renderSingleHorizontalStaffline: true }));
      var page = new opensheetmusicdisplay.OpenSheetMusicDisplay($('page'), opts);

      var t1 = now();
      return ribbon.load(xml).then(function () {
        time('parse (ribbon)', t1);
        tighten(ribbon);
        var t2 = now();
        ribbon.render();
        time('render ribbon (zoom 1.0)', t2);
        var h = staffHeight($('ribbon'));
        if (h && Math.abs(h - TARGET_STAFF_PX) > 3) {
          ribbon.zoom = TARGET_STAFF_PX / h;
          var t3 = now();
          ribbon.render();
          time('re-render ribbon (zoom ' + ribbon.zoom.toFixed(2) + ')', t3);
        }
        // Measure positions from OSMD's own layout (unit = 10 px × zoom).
        var t4 = now();
        var u = 10 * ribbon.zoom;
        boxes = ribbon.GraphicSheet.MeasureList.map(function (staves) {
          var gm = staves && staves[0];
          if (!gm) return null;
          var ps = gm.PositionAndShape;
          return { n: gm.MeasureNumber, span: gm.parentSourceMeasure && gm.parentSourceMeasure.multipleRestMeasures || 1,
                   x: Math.round(ps.AbsolutePosition.x * u), w: Math.round(ps.Size.width * u) };
        }).filter(Boolean);
        time('measure positions', t4);

        var t5 = now();
        return page.load(xml).then(function () {
          time('parse (page)', t5);
          tighten(page);
          page.zoom = ribbon.zoom;
          var t6 = now();
          page.render();
          time('render page', t6);
          results.notes.push('OSMD ' + page.Version);
          finish();
        });
      });
    });
  }

  // ---- Verovio ----
  function runVerovio(xml) {
    var t0 = now();
    return loadScript('vendor/verovio-toolkit-wasm.js').then(function () {
      time('library load', t0);
      var t1 = now();
      return new Promise(function (resolve) {
        if (verovio.module.calledRun) resolve();
        else verovio.module.onRuntimeInitialized = resolve;
      }).then(function () {
        time('wasm init', t1);
        var tk = new verovio.toolkit();
        results.notes.push('Verovio ' + tk.getVersion());
        var base = { header: 'none', footer: 'none', adjustPageHeight: true, pageHeight: 60000,
                     pageMarginLeft: 40, pageMarginRight: 40, pageMarginTop: 40, pageMarginBottom: 40 };
        var scale = 40;

        function renderRibbon() {
          tk.setOptions(Object.assign({}, base, { scale: scale, breaks: 'none', adjustPageWidth: true }));
          var t = now();
          tk.loadData(xml);
          $('ribbon').innerHTML = tk.renderToSVG(1);
          return Math.round(now() - t);
        }

        var t2 = now();
        tk.setOptions(Object.assign({}, base, { scale: scale, breaks: 'none', adjustPageWidth: true }));
        tk.loadData(xml);
        time('parse (ribbon)', t2);
        var t3 = now();
        $('ribbon').innerHTML = tk.renderToSVG(1);
        time('render ribbon (scale 40)', t3);
        var h = staffHeight($('ribbon'));
        if (h && Math.abs(h - TARGET_STAFF_PX) > 3) {
          scale = Math.round(scale * TARGET_STAFF_PX / h);
          var ms = renderRibbon();
          results.timings['re-render ribbon (scale ' + scale + ', incl. parse)'] = ms;
          log('re-render ribbon (scale ' + scale + ', incl. parse): ' + ms + ' ms');
        }

        // Measure positions from the rendered SVG; the number comes from the toolkit.
        var t4 = now();
        var origin = $('ribbon').getBoundingClientRect();
        boxes = Array.prototype.map.call($('ribbon').querySelectorAll('g.measure'), function (g) {
          // The staff lines span exactly the measure; the group's own box includes text above it.
          var line = g.querySelector('g.staff > path');
          var r = (line || g).getBoundingClientRect();
          var attr = tk.getElementAttr(g.id) || {};
          return { n: Number(attr.n), span: 1, x: Math.round(r.left - origin.left), w: Math.round(r.width) };
        });
        time('measure positions', t4);

        var t5 = now();
        var cw = $('page').clientWidth;
        tk.setOptions(Object.assign({}, base, { scale: scale, breaks: 'auto', adjustPageWidth: false,
                                                pageWidth: Math.round(cw * 100 / scale) }));
        tk.loadData(xml);
        $('page').innerHTML = tk.renderToSVG(1);
        time('parse + render page', t5);
        if (tk.getPageCount() > 1) results.notes.push('page view has ' + tk.getPageCount() + ' pages; only page 1 shown');
        finish();
      });
    });
  }

  var tf = now();
  fetch(src).then(function (res) {
    if (!res.ok) throw new Error('HTTP ' + res.status + ' for ' + src + ' (copy the MusicXML into poc/score/)');
    return res.text();
  }).then(function (xml) {
    time('fetch MusicXML (' + (xml.length / 1024).toFixed(0) + ' KB)', tf);
    return which === 'osmd' ? runOsmd(xml) : runVerovio(xml);
  }).catch(fail);

  $('prevM').addEventListener('click', function () { showMeasure(cur - 1); });
  $('nextM').addEventListener('click', function () { showMeasure(cur + 1); });
  $('playM').addEventListener('click', function () {
    if (timer) { clearInterval(timer); timer = null; this.textContent = 'Step every 1 s'; return; }
    this.textContent = 'Stop';
    timer = setInterval(function () { showMeasure(cur + 1 >= boxes.length ? 0 : cur + 1); }, 1000);
  });
})();
</script>
</body>
</html>
